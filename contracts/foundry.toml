[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
remappings = ["forge-std/=node_modules/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[lint]
exclude_lints = ["asm-keccak256"]
