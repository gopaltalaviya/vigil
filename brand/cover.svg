<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Vigil cover: The rollup that never looks away.">
  <title>Vigil: the rollup that never looks away.</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082018"/>
      <stop offset="1" stop-color="#030C09"/>
    </linearGradient>
    <radialGradient id="glowA" cx="1010" cy="100" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="120" cy="720" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A7F3D0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="720" fill="url(#fade)"/></mask>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2C22"/>
      <stop offset="1" stop-color="#0A1F18"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2A20"/>
      <stop offset="1" stop-color="#04100C"/>
    </linearGradient>
    <radialGradient id="glow" cx="100" cy="96" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <symbol id="mark" viewBox="0 0 200 200">
      <rect width="200" height="200" rx="46" fill="url(#bg)"/>
      <rect x="1" y="1" width="198" height="198" rx="45" fill="none" stroke="#A7F3D0" stroke-opacity="0.16" stroke-width="2"/>
      <rect width="200" height="200" rx="46" fill="url(#glow)"/>
      <polygon points="100,16 50,64 100,86" fill="#D1FAE5"/>
      <polygon points="100,16 150,64 100,86" fill="#6EE7B7"/>
      <polygon points="50,64 100,86 100,152 50,130" fill="#34D399"/>
      <polygon points="150,64 100,86 100,152 150,130" fill="#10B981"/>
      <polygon points="50,130 100,152 100,186" fill="#059669"/>
      <polygon points="150,130 100,152 100,186" fill="#047857"/>
      <path d="M50 64 L100 86 L150 64 M100 86 V152 M50 130 L100 152 L150 130" fill="none" stroke="#ECFDF5" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
      <path d="M160 30 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ECFDF5"/>
    </symbol>
  </defs>

  <rect width="1280" height="720" fill="url(#page)"/>
  <rect width="1280" height="720" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="720" fill="url(#glowA)"/>
  <rect width="1280" height="720" fill="url(#glowB)"/>

  <g font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <use href="#mark" x="80" y="68" width="68" height="68"/>
    <text x="164" y="116" font-size="36" font-weight="700" letter-spacing="-0.8" fill="#F0FDF4">Vigil</text>

    <g transform="translate(80,236)">
      <rect width="234" height="36" rx="18" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.4"/>
      <circle cx="20" cy="18" r="4" fill="#34D399"/>
      <text x="34" y="24" font-size="15" font-weight="600" letter-spacing="0.4" fill="#6EE7B7">Post-quantum rollup stack</text>
    </g>
    <text x="80" y="356" font-size="68" font-weight="700" letter-spacing="-2.4" fill="#F0FDF4">The rollup that</text>
    <text x="80" y="432" font-size="68" font-weight="700" letter-spacing="-2.4" fill="#34D399">never looks away.</text>
    <text x="80" y="492" font-size="22" fill="#9DBFB1">ML-DSA-signed batches, verified settlement,</text>
    <text x="80" y="524" font-size="22" fill="#9DBFB1">and a watchtower that re-checks every batch.</text>

    <g transform="translate(80,584)" font-size="15" font-weight="600" fill="#D1FAE5">
      <rect width="170" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#A7F3D0" stroke-opacity="0.18"/>
      <text x="85" y="26" text-anchor="middle">Protocol Builders</text>
      <rect x="182" width="174" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#A7F3D0" stroke-opacity="0.18"/>
      <text x="269" y="26" text-anchor="middle">QoreChain testnet</text>
    </g>

    <g transform="translate(724,150)" filter="url(#shadow)">
      <rect width="476" height="420" rx="24" fill="url(#card)"/>
      <rect x="0.5" y="0.5" width="475" height="419" rx="23.5" fill="none" stroke="#A7F3D0" stroke-opacity="0.16"/>
    </g>
    <g transform="translate(724,150)">
      <text x="32" y="50" font-size="18" font-weight="600" fill="#F0FDF4">Watchtower</text>
      <g transform="translate(346,28)">
        <rect width="98" height="30" rx="15" fill="#34D399" fill-opacity="0.14"/>
        <circle cx="18" cy="15" r="4" fill="#34D399"/>
        <text x="30" y="20" font-size="13" font-weight="600" fill="#6EE7B7">On duty</text>
      </g>
      <line x1="32" y1="78" x2="444" y2="78" stroke="#A7F3D0" stroke-opacity="0.12"/>

      <g font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="15">
        <g transform="translate(32,98)">
          <rect width="412" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
          <circle cx="28" cy="28" r="12" fill="#34D399" fill-opacity="0.18"/>
          <path d="M22.5 28.5l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="54" y="33" fill="#ECFDF5">batch 41</text>
          <text x="396" y="33" text-anchor="end" fill="#6EE7B7">re-executed</text>
        </g>
        <g transform="translate(32,164)">
          <rect width="412" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
          <circle cx="28" cy="28" r="12" fill="#34D399" fill-opacity="0.18"/>
          <path d="M22.5 28.5l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="54" y="33" fill="#ECFDF5">batch 42</text>
          <text x="396" y="33" text-anchor="end" fill="#6EE7B7">re-executed</text>
        </g>
        <g transform="translate(32,230)">
          <rect width="412" height="56" rx="14" fill="#F87171" fill-opacity="0.09" stroke="#F87171" stroke-opacity="0.45"/>
          <circle cx="28" cy="28" r="12" fill="#F87171" fill-opacity="0.2"/>
          <path d="M23 23l10 10M33 23l-10 10" fill="none" stroke="#F87171" stroke-width="2.4" stroke-linecap="round"/>
          <text x="54" y="33" fill="#ECFDF5">batch 43</text>
          <text x="396" y="33" text-anchor="end" fill="#FCA5A5">challenged</text>
        </g>
      </g>

      <line x1="32" y1="312" x2="444" y2="312" stroke="#A7F3D0" stroke-opacity="0.12"/>
      <g font-size="13" fill="#86A99B">
        <text x="32" y="344">Signature</text>
        <text x="186" y="344">Encryption</text>
        <text x="340" y="344">Settlement</text>
      </g>
      <g font-size="18" font-weight="600" fill="#F0FDF4">
        <text x="32" y="374">ML-DSA-87</text>
        <text x="186" y="374">ML-KEM-1024</text>
        <text x="340" y="374">Verified</text>
      </g>
    </g>
  </g>
</svg>
