# Vigil on one host. Usage, from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
# Secrets come from ../.env (never committed). State lives in the vigil-data volume.
name: vigil

x-service: &service
  image: vigil:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file: ../.env
  environment: &environment
    VIGIL_DATA_DIR: /data
  volumes:
    - vigil-data:/data
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 40s

services:
  watchtower:
    <<: *service
    command: ["packages/watchtower/dist/main.js"]
    environment:
      <<: *environment
      WATCHTOWER_INTERVAL_MS: ${WATCHTOWER_INTERVAL_MS:-5000}
      WATCHTOWER_CHALLENGE: ${WATCHTOWER_CHALLENGE:-on}
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  batcher:
    <<: *service
    command: ["packages/batcher/dist/main.js"]
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  monitor:
    <<: *service
    command: ["packages/monitor/dist/main.js"]

  receipts:
    <<: *service
    # Records the receipt of every newly anchored batch, every five minutes.
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do node packages/receipts/dist/main.js sync || true; sleep 300; done"]

  api:
    <<: *service
    command: ["packages/api/dist/main.js"]
    # The API reads the database only: it gets no seed phrase and no tokens.
    env_file: []
    environment:
      <<: *environment
      ROLLUP_ID: ${ROLLUP_ID:-vigil-1}
      VIGIL_RECEIPTS_ADDRESS: ${VIGIL_RECEIPTS_ADDRESS:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["public"]
    environment:
      VIGIL_DOMAIN: ${VIGIL_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  vigil-data:
  caddy-data:
  caddy-config:
